<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes wave{0%{transform:translateX(0)}50%{transform:translateX(-30px)}}@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:52px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#cbd5e1}.animated-wave{animation:wave 8s ease-in-out infinite}.animated-pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g class="animated-pulse"><circle cx="150" cy="80" r="180" fill="#6366f1" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="220" r="200" fill="#ec4899" filter="url(#glow)" opacity=".12"/></g><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M -50 220 Q 150 160 350 230 T 750 200 T 1150 240 T 1350 190" class="animated-wave" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 240 Q 200 280 400 210 T 800 250 T 1200 210" class="animated-wave" opacity=".3" style="animation-delay:-3s"/><g opacity=".25"><line x1="900" x2="1100" y1="60" y2="60" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="1000" x2="1000" y1="60" y2="160" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="900" cy="60" r="4" fill="#a855f7"/><circle cx="1100" cy="60" r="4" fill="#6366f1"/><circle cx="1000" cy="160" r="4" fill="#ec4899"/></g><rect width="1120" height="230" x="40" y="35" fill="url(#card-grad)" stroke="#fff" stroke-opacity=".1" stroke-width="1" rx="12"/><rect width="1120" height="4" x="40" y="35" fill="url(#accent-grad)" rx="2"/><g><g transform="translate(80, 100) translate(0, -35)"><rect width="48" height="48" fill="url(#accent-grad)" rx="10"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M16 24 L22 30 L32 18"/></g><text x="68" y="0" class="title" transform="translate(80, 100)">Awesome Endpoint Forensics 🔍</text><text x="68" y="42" class="subtitle" transform="translate(80, 100)">Curated DFIR Ecosystem • Live Response • Triage • Evidence Acquisition</text><g transform="translate(80, 100) translate(68, 75)"><rect width="160" height="32" x="0" y="0" fill="#6366f1" fill-opacity=".2" stroke="#6366f1" stroke-opacity=".5" rx="16"/><text x="80" y="20" class="badge-text" text-anchor="middle">⚡ Live Response</text><rect width="180" height="32" x="172" y="0" fill="#a855f7" fill-opacity=".2" stroke="#a855f7" stroke-opacity=".5" rx="16"/><text x="262" y="20" class="badge-text" text-anchor="middle">🛡️ Memory &amp; Disk</text><rect width="170" height="32" x="364" y="0" fill="#ec4899" fill-opacity=".2" stroke="#ec4899" stroke-opacity=".5" rx="16"/><text x="449" y="20" class="badge-text" text-anchor="middle">📊 Triage Analysis</text></g></g></svg>