<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #cbd5e1; }
    
    @keyframes wave {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    .animated-wave { animation: wave 8s ease-in-out infinite; }
    .animated-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Animated Grid & Graphic Elements (Background Layer) -->
  <g class="animated-pulse">
    <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="1050" cy="220" r="200" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Dynamic Waves / Graphs in Background -->
  <path class="animated-wave" d="M -50 220 Q 150 160 350 230 T 750 200 T 1150 240 T 1350 190" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" />
  <path class="animated-wave" d="M -50 240 Q 200 280 400 210 T 800 250 T 1200 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" style="animation-delay: -3s;" />

  <!-- Background Decorative Tech Nodes -->
  <g opacity="0.25">
    <line x1="900" y1="60" x2="1100" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="1000" y1="60" x2="1000" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="900" cy="60" r="4" fill="#a855f7" />
    <circle cx="1100" cy="60" r="4" fill="#6366f1" />
    <circle cx="1000" cy="160" r="4" fill="#ec4899" />
  </g>

  <!-- Content Card Container (Semi-transparent overlay to ensure title clarity) -->
  <rect x="40" y="35" width="1120" height="230" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Accent Top Border Line -->
  <rect x="40" y="35" width="1120" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Foreground Content (Title & Subtitle clearly visible) -->
  <g transform="translate(80, 100)">
    <!-- Icon Badge -->
    <g transform="translate(0, -35)">
      <rect width="48" height="48" rx="10" fill="url(#accent-grad)" />
      <path d="M16 24 L22 30 L32 18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Header Text -->
    <text x="68" y="0" class="title">Awesome Endpoint Forensics 🔍</text>
    <text x="68" y="42" class="subtitle">Curated DFIR Ecosystem • Live Response • Triage • Evidence Acquisition</text>

    <!-- Tag Pills (Foreground) -->
    <g transform="translate(68, 75)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.5" />
      <text x="80" y="20" text-anchor="middle" class="badge-text">⚡ Live Response</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="180" height="32" rx="16" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.5" />
      <text x="262" y="20" text-anchor="middle" class="badge-text">🛡️ Memory &amp; Disk</text>

      <!-- Pill 3 -->
      <rect x="364" y="0" width="170" height="32" rx="16" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-opacity="0.5" />
      <text x="449" y="20" text-anchor="middle" class="badge-text">📊 Triage Analysis</text>
    </g>
  </g>
</svg>
